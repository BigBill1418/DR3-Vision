# =============================================================================
# DR3-Vision — production stack (CHAD-HQ, 10.99.0.2)
# =============================================================================
# Architecture (T-001 placeholder):
#   cloudflared (edge TLS, dr3-vision tunnel 3999bb3b-…)
#       ↓ HTTP/1.1 over compose bridge
#   app  (Next.js 15 standalone, listens on :3000 inside the network)
#
# T-002+ adds postgres (managed via Prisma); T-007 adds object-storage wiring
# to Cloudflare R2. None of those land in this file until their tickets ship.
#
# The NOC swarmpilot_deployer on HSH-HQ polls this repo every 30s. On new
# main commits it SSHes to CHAD-HQ, pulls, runs:
#   docker compose -f deploy/docker-compose.yml --project-directory . up -d
# Per ADR-0008 (svdp-intranet), cloudflared lives INSIDE this compose with
# its own per-service tunnel (not on host-systemd), to keep the ingress
# graph isolated and make rollback atomic with the app rollback.
#
# Tunnel + token live in ~/.dr3-vision-secrets/tunnel.env on CHAD-HQ
# (mode 600, NOT in the repo). The deployer is configured to source it
# via env_file. To rotate: re-mint via CF API + replace TUNNEL_TOKEN.
# =============================================================================
name: dr3-vision

x-barnardhq-labels: &barnardhq-labels
  com.barnardhq.project: 'dr3-vision'
  com.barnardhq.env: 'prod'
  com.barnardhq.tenant: 'svdp'
  com.barnardhq.stack: 'dr3-vision'

x-logging: &logging
  driver: json-file
  options:
    max-size: '50m'
    max-file: '5'

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: dr3-vision-app:local
    container_name: dr3-vision-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      # T-001 ships without a database; downstream tickets add real env vars
      # via .env on CHAD-HQ (NEXTAUTH_SECRET, DATABASE_URL, R2_*, MYMRC_*).
      # Prisma client is generated at build with a placeholder URL — see
      # Dockerfile. Runtime placeholder URL keeps the client importable
      # from anywhere in the codebase even though no query runs in T-001.
      DATABASE_URL: 'postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder?schema=public'
    networks:
      - dr3net
    labels:
      <<: *barnardhq-labels
      com.barnardhq.service: 'app'
    logging: *logging
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:2026.3.0
    container_name: dr3-vision-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - /home/bbarnard065/.dr3-vision-secrets/tunnel.env
    depends_on:
      app:
        condition: service_healthy
    networks:
      - dr3net
    labels:
      <<: *barnardhq-labels
      com.barnardhq.service: 'cloudflared'
    logging: *logging

networks:
  dr3net:
    name: dr3-vision_dr3net
    driver: bridge
