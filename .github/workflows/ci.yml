# Correctness gate CI (ADR-0033 / P0-4).
#
# The enforced typecheck this workflow runs is the gate that the
# `SignatureDb.total_payout_cents: number` type-lie — which zeroed the
# 2026-06-22 sign-time payout lock — would have tripped before reaching prod.
# Runs on every push and PR: typecheck + full test suite + production build.
#
# RUNNER NOTE: the fleet has self-hosted GitHub Actions runners on BOS-HQ, but
# their labels are not confirmed from this workspace. This targets the hosted
# `ubuntu-latest` runner, which needs no fleet access (no DB, no secrets — the
# build uses a dummy DATABASE_URL and the suite mocks every boundary). If the
# repo should run on the self-hosted pool instead, change `runs-on` to the
# confirmed self-hosted label (e.g. `[self-hosted, bos-hq]`).

name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Cancel superseded runs on the same ref to save runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    env:
      # next build / prisma client only need a syntactically-valid URL — nothing
      # in this pipeline connects to a database (routes are force-dynamic; the
      # test suite mocks @/lib/prisma). A real DB is never reached.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      # Keep Next build telemetry off in CI.
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Record integrity (ADR-0098) ──────────────────────────────────────
      # Deliberately placed BEFORE `npm ci`: both scripts are dependency-free
      # (node + fs only), so an unresolved citation fails in seconds instead of
      # after a five-minute build. The citation resolver is also asserted by
      # `src/__tests__/adr-record-integrity.test.ts` in the suite below — this
      # step exists to give the failure its own name in the checks list.
      #
      # The class it catches: six source files and one test cited "ADR-0065
      # Amendment 2" for twelve days while no such amendment existed. The work
      # had shipped; the record had not, and nothing said so.
      - name: ADR citation resolver (hard gate)
        run: node scripts/check-adr-citations.mjs

      # ADVISORY, never blocking — it emits `::warning::` annotations and always
      # exits 0. Same reasoning as the `migrate diff` step in the migrations job
      # below: a hard gate on pre-existing drift would red-on-arrival every PR and
      # MASK the real gate above. See ADR-0098 §3 for why this warns rather than
      # fails, and why a registry row replaced P5's "GitHub issue link".
      - name: ADR promise registry coverage (advisory)
        run: node scripts/extract-adr-promises.mjs --check

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck (tsc --noEmit) — the payroll Decimal type-lie gate
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (vitest run — full suite)
        run: npm test

      - name: Production build (next build)
        run: npm run build

  # ────────────────────────────────────────────────────────────────────────
  # Migration-check gate (ADR-0035).
  #
  # The class of bug this catches: a migration that PASSES against the live DB
  # but FAILS on a fresh/empty database — because CI never ran migrations, it
  # only reached prod. The 2026-06-22→23 survey migration
  # (`20260622_operational_intelligence_survey`) declared a uuid FK to
  # `users.id` which is actually TEXT, so `prisma migrate deploy` blew up only
  # at deploy time (the live recovery: apply corrected TEXT tables by hand, mark
  # applied, resync checksum). The same class includes an `ALTER TYPE … ADD
  # VALUE` whose `CREATE TYPE` lives in a later-timestamped migration: GREEN
  # against a live DB that already has the type, RED on every clean
  # provision / DR restore-to-empty.
  #
  # This job spins up an EPHEMERAL Postgres 16 and runs the full migration set
  # in order against an EMPTY database — exactly the path a fresh provision or a
  # DR restore takes — so a bad migration fails CI BEFORE any deploy. Throwaway
  # DB, no secrets, no fleet access.
  migrations:
    name: prisma migrate deploy (clean DB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dr3_ci
        ports:
          - 5432:5432
        # Wait for the server to accept connections before the job's steps run.
        options: >-
          --health-cmd "pg_isready -U ci -d dr3_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Points at the ephemeral service container — a REAL, empty database.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/dr3_ci?schema=public
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply ALL migrations to a clean DB (prisma migrate deploy)
        # `migrate deploy` replays every migration in `prisma/migrations/` in
        # timestamp order against the empty DB. A uuid-vs-TEXT FK mismatch, an
        # ALTER-before-CREATE, a checksum drift, or any SQL that only works
        # against an already-populated schema fails HERE, in CI, not on deploy.
        run: npx prisma migrate deploy

      - name: Assert migrations are in sync (prisma migrate status)
        # Belt to the deploy step: after a clean apply, status must report the
        # schema up to date. A non-zero exit (drift / failed / pending) fails CI.
        run: npx prisma migrate status

      - name: Generate Prisma client (for the real-DB suites below)
        run: npx prisma generate

      - name: Real-database guards (ADR-0078)
        # This job already stands up a REAL Postgres 16 and applies the whole
        # migration chain to it — and until now it threw that database away
        # without asserting a single behaviour. The `correctness` job cannot
        # cover these: it runs with a dummy DATABASE_URL and mocks
        # `@/lib/prisma`, so a claim about `ON CONFLICT DO NOTHING`, about a
        # PRIMARY KEY refusing a duplicate, or about `ORDER BY … created_at
        # DESC` breaking a tie would be measuring the mock that enforces it.
        #
        # DR3_TEST_DATABASE_URL and DATABASE_URL are deliberately the SAME
        # value: the services under test write through the `@/lib/prisma`
        # singleton (DATABASE_URL) while the assertions read their own client
        # (DR3_TEST_DATABASE_URL). If those diverged the suites would write to
        # one database and check the other, and "no duplicate rows" would be
        # true for the boring reason. `floor-exactly-once.db.test.ts` throws
        # rather than run if they ever differ.
        env:
          DR3_TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/dr3_ci?schema=public
        # `db.test.ts` is a PATH FILTER, not a glob — vitest CLI positional args
        # match against file paths. A glob here matches nothing and exits 1.
        #
        # `--no-file-parallelism` because these suites share ONE database: run in
        # parallel they clean up rows the other is still using, which fails
        # intermittently and by interleaving — the worst shape of CI flake.
        run: npx vitest run --reporter=basic --no-file-parallelism db.test.ts

      - name: Report Prisma schema vs migrated DB drift (advisory — non-blocking)
        # Surfaces a schema.prisma change that was NOT captured in a migration
        # (the "edited schema, forgot to add the migration" class). `migrate
        # diff --exit-code` returns 2 when a diff exists.
        #
        # NON-BLOCKING by design (continue-on-error): as of 2026-06-23 there is
        # PRE-EXISTING, mostly-cosmetic drift on main (Prisma wants to rename
        # hand-authored `*_fk` constraints to its `*_fkey`/`*_key` convention,
        # plus a few benign structural items). Making this a hard gate today
        # would red-on-arrival every PR and MASK the real ordering gate below.
        # The HARD gate is the clean-DB `migrate deploy` + `migrate status`
        # steps above (those catch tonight's uuid-vs-TEXT / ALTER-before-CREATE
        # class). This step is a visible warning until the drift is reconciled
        # in a dedicated migration; promote it to a hard gate (drop
        # continue-on-error) once that lands. See ADR-0035.
        continue-on-error: true
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code \
          && echo "schema in sync with migrated clean DB" \
          || echo "::warning::schema.prisma drifts from the migrated clean DB (pre-existing, advisory — see ADR-0035). The hard ordering gate (migrate deploy + status) still passed."
