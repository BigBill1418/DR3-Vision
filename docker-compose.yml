  survey-reminder:
    # Survey daily-reminder + auto-close cron host (ADR-0036).
    #
    # Long-running Node daemon (same shape as bonus-escalation-check /
    # bonus-daily-report): a single process under `unless-stopped` that is a THIN
    # Pacific scheduler. It sleeps until the next 09:00 America/Los_Angeles instant
    # (recomputed each cycle off the Pacific wall clock so it survives the Mar/Nov
    # DST shifts) and on each fire POSTs the app's internal, loopback-guarded route
    # (`/api/internal/survey/reminder-tick`). That route does all the real work
    # compiled inside the Next app via `runSurveyReminderTick`: for every OPEN
    # campaign it sends one reminder per still-unsubmitted invite (tiered copy) and
    # auto-closes the campaign once the last response lands. The daemon imports NO
    # TS and no @prisma/client — the fire time is fixed, so it reads nothing from
    # the DB (hence NO db.env here, unlike bonus-daily-report).
    #
    # Needs only the app's INTERNAL_CRON_TOKEN (cron.env, the defense-in-depth
    # bearer for the internal route; split out of auth.env 2026-07-21 per the
    # ADR-0053 addendum — cron containers no longer carry NEXTAUTH_SECRET).
    # INTERNAL_BASE_URL reaches the app over the compose network by service name
    # (not loopback — separate container); the route's cf-connecting-ip guard still
    # rejects any public-tunnel request.
    #
    # Idempotent: the route's 20h `last_reminder_at` DB gate means a slightly-early
    # fire or a restart-triggered re-POST never double-sends, and a no-op fires
    # cleanly when no campaign is open.
    image: dr3-vision-app:local
    container_name: dr3-vision-survey-reminder
    init: true
    restart: unless-stopped
    command: ['node', 'scripts/survey-reminder-cron.mjs']
    # Cron daemon, not the web app — disable the inherited HTTP /healthz
