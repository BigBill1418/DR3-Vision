  board-pack-digest:
    # Board-pack digest cron host (ADR-0045 §3 addendum, planning rollup §1.8).
    #
    # Same shape as survey-reminder: a single long-running Node process under
    # `unless-stopped`, a THIN Pacific scheduler. It sleeps until the next 07:00
    # America/Los_Angeles instant and on each fire POSTs the app's internal,
    # loopback-guarded route (`/api/internal/board-pack/send`). The ROUTE decides
    # whether today is a board-pack day (2nd Wednesday OR the preceding Monday, via
    # the ADR-0045 digest-calendar) — on any other day the fire is a clean no-op.
    # On a board-pack day it builds the payload (prev-month processed units, MTD,
    # YoY, P&L placeholder) and sends via notifyStaff('board_pack_digest') (org-wide,
    # born pilot ⇒ reroutes to admins). The daemon imports NO TS and no
    # @prisma/client — the fire time is fixed.
    #
    # Idempotent: the send records a per-period ledger so a same-day re-fire or a
    # container restart never double-sends. First LIVE send targets 2026-08-10, but
    # the surface ships PILOT (admin-validation only) until Bill ramps it.
    image: dr3-vision-app:local
    container_name: dr3-vision-board-pack-digest
    # Resource ceilings (audit 2026-07-16 · RES) — conservative blast-radius
    # cap on the shared host for a Chromium-invoking cron. Generous vs RSS.
    mem_limit: 1024m
    pids_limit: 256
    init: true
    restart: unless-stopped
    command: ['node', 'scripts/board-pack-digest-cron.mjs']
    # Cron daemon, not the web app — disable the inherited HTTP /healthz HEALTHCHECK.
    healthcheck:
