# =============================================================================
# DR3-Vision — production stack (CHAD-HQ, 10.99.0.2)
# =============================================================================
# Architecture (T-001 placeholder):
#   cloudflared (edge TLS, dr3-vision tunnel 3999bb3b-…)
#       ↓ HTTP/1.1 over compose bridge
#   app  (Next.js 15 standalone, listens on :3000 inside the network)
#
# T-002+ adds postgres (managed via Prisma); T-007 adds object-storage wiring
# to Cloudflare R2. None of those land in this file until their tickets ship.
#
# The NOC swarmpilot_deployer on HSH-HQ polls this repo every 5s. On new
# main commits it SSHes to CHAD-HQ, pulls, runs `docker compose up -d`
# from the repo root — that's THIS file. The local-dev compose lives at
# `docker-compose.dev.yml` (postgres + minio + optional containerized
# app) and is invoked explicitly with `-f` per `HANDOFF.md` Step 3.
#
# WHY THIS IS THE ROOT-LEVEL FILE: the deployer's remote-deploy code
# path (compose stacks on non-HQ hosts) does NOT honor the
# `compose_file:` config knob — only the local-deploy path does. So
# the deployer always invokes the default `docker-compose.yml` on
# CHAD-HQ. If the dev compose were at root, every deploy would tear
# down cloudflared as an "orphan" and break the tunnel (this exact
# regression happened 2026-05-06; recovery + restructure shipped in
# the same commit). ADR-0013 §1 documents the structural choice.
#
# Per ADR-0008 (svdp-intranet), cloudflared lives INSIDE this compose
# with its own per-service tunnel (not on host-systemd), to keep the
# ingress graph isolated and make rollback atomic with the app rollback.
#
# Tunnel + token live in ~/.dr3-vision-secrets/tunnel.env on CHAD-HQ
# (mode 600, NOT in the repo). The deployer sources it via env_file.
# To rotate: re-mint via CF API + replace TUNNEL_TOKEN.
# =============================================================================
name: dr3-vision

x-barnardhq-labels: &barnardhq-labels
  com.barnardhq.project: 'dr3-vision'
  com.barnardhq.env: 'prod'
  com.barnardhq.tenant: 'svdp'
  com.barnardhq.stack: 'dr3-vision'

x-logging: &logging
  driver: json-file
  options:
    max-size: '50m'
    max-file: '5'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dr3-vision-postgres
    restart: unless-stopped
    env_file:
      - /home/bbarnard065/.dr3-vision-secrets/db.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dr3net
    labels:
      <<: *barnardhq-labels
      com.barnardhq.service: 'postgres'
    logging: *logging
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dr3 -d dr3_vision']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    # One-shot init container. Runs `prisma migrate deploy` against the
    # production DB on every compose-up; idempotent (no-op if no pending
    # migrations). The app waits for this to complete successfully before
    # starting, so a failed migration aborts the deploy at the
    # depends_on gate rather than letting the app come up with a stale
    # schema. Per HANDOFF.md "Production seeding": seed CSVs run only
    # for the first deploy, and via a separate manual `npx prisma db
    # seed` invocation — NOT in this init container.
    image: dr3-vision-app:local
    container_name: dr3-vision-migrate
    restart: 'no'
    # Explicit path avoids the `.bin/prisma` symlink-flattening trap
    # documented in the Dockerfile runner stage.
    command: ['node', 'scripts/migrate-with-ntfy.mjs']
    env_file:
      - /home/bbarnard065/.dr3-vision-secrets/db.env
      # System-level ntfy alerts (ADR-0036) — same fail-soft contract as
      # the app service. The migrate wrapper publishes one event per
      # newly-applied migration to `dr3-vision-system`.
      - path: /home/bbarnard065/.dr3-vision-secrets/ntfy.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dr3net
    labels:
      <<: *barnardhq-labels
      com.barnardhq.service: 'migrate'
    logging: *logging

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dr3-vision-app:local
    container_name: dr3-vision-app
    # Resource ceilings (audit 2026-07-16 · RES) — a conservative blast-radius cap
    # on the shared ~15-tenant host so an in-app Chromium PDF/stamp render can't
    # OOM or fork-bomb co-tenants (init:true reaps zombies but does not cap).
    # Sized generously above observed RSS; not tight tuning.
    mem_limit: 1500m
    pids_limit: 512
    # tini as PID 1 reaps exited Playwright/chromium children. Without it, node
    # (PID 1) never reaps them and every bonus-PDF render leaks a defunct chrome
    # process — a 76-PDF backfill left 150 zombies (2026-06-09). (init nit)
    init: true
    restart: unless-stopped
    env_file:
      - /home/bbarnard065/.dr3-vision-secrets/db.env
      - /home/bbarnard065/.dr3-vision-secrets/auth.env
      # ADR-0053 addendum 2026-07-21 (P2 cron secret split): cron.env holds ONLY
      # INTERNAL_CRON_TOKEN, the single secret the cron daemons share with the
      # app. The app reads the token from here (env_file order: later files win,
      # so this stays correct whether or not auth.env still carries a copy);
      # the cron services mount cron.env INSTEAD of auth.env so a compromised
      # cron (several run Chromium on semi-external content) can no longer mint
      # admin JWTs offline with NEXTAUTH_SECRET / the Entra client secret.
      - /home/bbarnard065/.dr3-vision-secrets/cron.env
      # T-007 R2 photo upload. File is optional — when absent, the
      # photo flow falls back to the placeholder `pending-r2-…` keys
      # so the workflow keeps working before R2 creds land.
      - path: /home/bbarnard065/.dr3-vision-secrets/r2.env
        required: false
      # System-level ntfy alerts (ADR-0036 + ADR-0037). Optional so the
      # app boots fail-soft when the secret hasn't been dropped yet —
      # `src/lib/ntfy.ts` treats a missing `NTFY_PUBLISHER_TOKEN` as a
      # successful no-op. Operator runbook: docs/operator/ntfy-setup.md.
      - path: /home/bbarnard065/.dr3-vision-secrets/ntfy.env
        required: false
      # T-122 M365 Graph mail-send (ADR-0021). Holds M365_MAIL_FROM_ADDRESS +
      # M365_PAYROLL_TO_ADDRESS; the Entra creds it pairs with live in auth.env
      # above. Optional so the app stays fail-open (mail-send disabled) until the
      # mailbox + permission are provisioned. Verified working 2026-06-06.
      - path: /home/bbarnard065/.dr3-vision-secrets/m365.env
        required: false
      # T-123 observability export (added 2026-06-06). TEMPO_ENDPOINT (OTel
      # traces → local CHAD alloy OTLP → Tempo on BOS) + GLITCHTIP_DSN (error
      # tracking, GlitchTip project 26) + OTEL_TRACE_SAMPLE_RATE. Optional /
      # fail-open: tracing + error-reporting simply no-op when absent.
      - path: /home/bbarnard065/.dr3-vision-secrets/obs.env
        required: false
      # ADR-0040 D4 — EIA_API_KEY for the weekly West-Coast diesel fetch
      # (`src/lib/billing-rates/eia.ts`). Optional / FAIL-OPEN: absent key → the
      # fuel-fetch route logs + skips and never pages/crashes; the manual fuel-price
      # entry surface still works. Provision the key at api.eia.gov/opendata to
      # enable auto-fetch. See docs/operator/billing-rates.md.
      - path: /home/bbarnard065/.dr3-vision-secrets/billing.env
        required: false
      # ADR-0046 — Graph-mail transport creds (MSGRAPH_MAIL_{TENANT_ID,CLIENT_ID,
      # SECRET,MAILBOX}) + optional AP_QUARANTINE_EMAIL. The AP poll route +
      # transport run INSIDE this app process (thin daemon → internal route), so
      # the creds live here. Optional / FAIL-OPEN: absent → the transport selects
      # the fixture-driven MOCK (logged loudly at each poll), the app still boots.
      # See docs/operator/ap-approvals.md.
      - path: /home/bbarnard065/.dr3-vision-secrets/msgraph-mail.env
        required: false
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      # DATABASE_URL is supplied via env_file (db.env). Other downstream
      # env (NEXTAUTH_SECRET, R2_*, MYMRC_*) lands in T-003 / T-007.
    ports:
      # WireGuard-only host bind for the fleet Prometheus /metrics scrape
      # (ADR-0022 §4 / fleet observability wire-in 2026-06-06). The public
      # tunnel path is NOT a viable scrape route: `src/app/metrics/route.ts`
      # 404s any request carrying a `cf-connecting-ip` header, so /metrics is
      # reachable ONLY off-tunnel. InfraWatch's Prometheus (on BOS-HQ) reaches
      # this WG IP directly. Bound to 10.99.0.2 (CHAD WG) — NEVER 0.0.0.0 — so
      # the app's full surface is not published to the public host interface;
      # the public ingress stays exclusively through the cloudflared sidecar.
      # The /metrics IP-header guard is the auth boundary (no bearer token).
      - '10.99.0.2:9469:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - dr3net
    labels:
      <<: *barnardhq-labels
      com.barnardhq.service: 'app'
    logging: *logging
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  mymrc-scrape:
    # REBUILT under ADR-0038 (MyMRC ingestion rebuild, 2026-07-03) — the worker
    # now runs the JSON-transport mirror sync (hauls/processed/outbound → mirror
    # tables + run ledger; hauls also feed expected_loads). It stays PROFILE-GATED
    # (`mymrc`): activation is a deliberate operator action, NOT auto-started by
    # `docker compose up -d` or the swarmpilot deployer. To ENABLE, follow
    # docs/operator/mymrc-ingestion.md: (1) drop MYMRC_* creds into
    # ~/.dr3-vision-secrets/mymrc.env (mode 600), (2) ensure the mymrc-auth volume
    # is owned by uid 1001 (`docker run --rm -v dr3-vision_mymrc-auth-state:/v
    # alpine chown -R 1001:1001 /v`), (3) start with
    # `docker compose --profile mymrc up -d`, and (4) re-add `mymrc-scrape` to the
    # noc-master service-registry containers[]. A healthy run is silent; failures
    # page `dr3-vision-system` (auth_failed / contract_drift / zero-anomaly /
    # deadman) per ADR-0038 D4.
    profiles: ['mymrc']
    # Hourly cron host for the MyMRC scheduled-hauls scrape (T-015 /
    # ADR-0009). Long-running Node process that re-spawns
    # `scripts/mymrc-scrape.mjs` once on boot and once at the top of
    # every UTC hour. Per-run lifecycle: launch chromium, scrape both
    # sites sequentially with separate Playwright contexts, upsert
    # `expected_loads`, exit. Failures fire `dr3-vision-system` ntfy
    # with a 30-min cooldown per site.
    #
    # Fail-soft: when MYMRC_*_USERNAME / MYMRC_*_PASSWORD are unset,
    # the worker logs "creds not configured, skipping" and exits 0
    # without ntfy publish — that's an operator state, not a system
    # error. Drop credentials per `docs/operator/mymrc-ingestion.md` and
    # the next hourly tick begins populating the queue.
    image: dr3-vision-app:local
    container_name: dr3-vision-mymrc-scrape
    # Resource ceilings (audit 2026-07-16 · RES) — conservative blast-radius
    # cap on the shared host for a Chromium-invoking cron. Generous vs RSS.
    mem_limit: 1024m
    pids_limit: 256
    # Reap exited Playwright/chromium children (MyMRC scrape launches a browser).
    init: true
    restart: unless-stopped
    command: ['node', 'scripts/mymrc-cron.mjs']
    env_file:
      - /home/bbarnard065/.dr3-vision-secrets/db.env
      # MyMRC credentials — optional file. When absent, worker no-ops
      # per-tick and never alerts. See docs/operator/mymrc-ingestion.md.
      - path: /home/bbarnard065/.dr3-vision-secrets/mymrc.env
        required: false
      # Re-uses the same ntfy publisher token as the app + migrate
      # services; same fail-soft contract.
      - path: /home/bbarnard065/.dr3-vision-secrets/ntfy.env
        required: false
    environment:
      NODE_ENV: production
      MYMRC_HEADLESS: 'true'
      # Persist Playwright auth state across container restarts so we
      # don't re-login every hour. Mounted volume below.
      MYMRC_AUTH_STATE_DIR: /var/lib/dr3-vision/mymrc-auth
    volumes:
      - mymrc-auth-state:/var/lib/dr3-vision/mymrc-auth
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - dr3net
    labels:
      <<: *barnardhq-labels
      com.barnardhq.service: 'mymrc-scrape'
    logging: *logging

  bonus-period-close:
    # Bonus period-close cron host (ADR-0019.1 §3/§6, T-204). Replaces the
    # monthly T-125 close — `scripts/bonus-month-close.mjs` is gone; this runs
    # `scripts/bonus-period-close.mjs`.
    #
    # Long-running Node daemon (same shape as `mymrc-scrape`): a single process
    # under a single `unless-stopped` restart policy that sleeps until the next
    # 17:30 America/Los_Angeles instant (recomputed each cycle off the Pacific
    # wall clock, so it survives the Mar/Nov DST shifts) and on each fire POSTs
    # the app's internal, loopback-guarded close route
    # (`/api/internal/bonus/close-months`). That route transitions every draft
    # pay-period whose `period_end == appToday()` (Pacific) to
    # `pending_signatures` via the audited state machine and emails the facility
    # signer for each newly-closed period. On a non-period-end day no period
    # matches and the fire is a clean no-op.
    #
    # Schedule note: ADR-0019.1 §3 specifies "Mon 17:30 PT", but the daemon
    # fires DAILY at 17:30 PT — cron can't express "every other Monday" cleanly
    # and the close decision is keyed off the seeded `period_end` matching today,
    # so daily-tick + Pacific date check is the ADR-preferred (DST-robust) shape.
    #
    # Idempotent: the route only matches `state = 'draft'`, so a second fire on
    # the same day (or a restart-triggered re-fire) never double-transitions.
    image: dr3-vision-app:local
    container_name: dr3-vision-bonus-period-close
    # Resource ceilings (audit 2026-07-16 · RES) — conservative blast-radius
    # cap on the shared host for a Chromium-invoking cron. Generous vs RSS.
    mem_limit: 1024m
    pids_limit: 256
    # Reap exited Playwright/chromium children (period close renders the PDF).
    init: true
    restart: unless-stopped
    command: ['node', 'scripts/bonus-period-close.mjs']
    # This is a cron daemon, not the web app — disable the image's inherited
    # HTTP /healthz HEALTHCHECK (it would always fail here and show a false
    # "unhealthy"). Liveness is "the process is up"; restart:unless-stopped covers it.
    healthcheck:
      disable: true
    env_file:
      # INTERNAL_CRON_TOKEN bearer for the internal close route — from cron.env,
      # NOT auth.env (ADR-0053 addendum 2026-07-21, P2 cron secret split: no
      # cron script consumes NEXTAUTH_SECRET / the Entra client secret, so
      # auth.env no longer reaches any cron container). REQUIRED, not optional:
      # the app fail-closes /api/internal/** in prod (ADR-0054), so a missing
      # file must fail the deploy loudly at compose-config time — before any
      # container is recreated — rather than 404 every cron fire at runtime.
      - /home/bbarnard065/.dr3-vision-secrets/cron.env
    environment:
      NODE_ENV: production
      # Reach the app over the compose network by service name (not loopback —
      # this is a separate container). The route's cf-connecting-ip guard still
      # rejects any public-tunnel request; in-network POSTs carry no such header.
      INTERNAL_BASE_URL: http://app:3000
    depends_on:
      app:
        condition: service_healthy
    networks:
      - dr3net
    labels:
      <<: *barnardhq-labels
      com.barnardhq.service: 'bonus-period-close'
    logging: *logging

  bonus-escalation-check:
    # Bonus signature-escalation cron host (ADR-0019.1 §3/§4/§6, T-205 + T-206).
    #
    # Long-running Node daemon (same shape as `bonus-period-close`): a single
    # process under a single `unless-stopped` restart policy that sleeps until the
    # next of four Pacific wall-clock fire times — 06:00 (t1), 07:30 (t2), 08:30
    # (t3), 09:00 (t4) America/Los_Angeles, recomputed each cycle so it survives
    # the Mar/Nov DST shifts — and on each fire POSTs the app's internal,
    # loopback-guarded escalation route
    # (`/api/internal/bonus/escalation-check?tier=<t1|t2|t3|t4>`). That route
    # examines yesterday's-close periods (`period_end == appToday() - 1 day`,
    # Pacific) and per still-unsigned slot:
    #   t1 → low-urgency "still unsigned" ntfy
    #   t2 → urgent ntfy listing the override-authorized humans
    #   t3 → AUTO-OVERRIDE: system-sign each unsigned slot as the chain's
    #        configured auto-override actor via the audited state machine, then
    #        fire the PDF + M365 payroll delivery (the actor must be ACTIVE first,
    #        else urgent ntfy + NO auto-sign — risk mitigation)
    #   t4 → (T-206) urgent payroll-deadline-missed ntfy for any period not yet
    #        `paid` at 09:00 PT
    #
    # Schedule note: the daemon fires DAILY at each time. ADR-0019.1's escalation
    # is "every other Tuesday", but the route keys off the seeded `period_end`
    # matching yesterday, so on a non-period morning no period matches and the
    # fire is a clean no-op (daily-tick + Pacific date check, DST-robust — same
    # rationale as the period-close daemon).
    #
    # Idempotent: t1/t2/t4 are fingerprinted+cooled in the ntfy helper; t3's
    # auto-override is rejected by `recordSignature` for an already-signed slot,
    # so a manual sign before 08:30 (or a restart-triggered re-POST) is never
    # double-overridden.
    image: dr3-vision-app:local
    container_name: dr3-vision-bonus-escalation-check
    # Resource ceilings (audit 2026-07-16 · RES) — conservative blast-radius
    # cap on the shared host for a Chromium-invoking cron. Generous vs RSS.
    mem_limit: 1024m
    pids_limit: 256
    # Consistent with the other app-image services — reap any child subprocess.
    init: true
    restart: unless-stopped
    command: ['node', 'scripts/bonus-escalation-check.mjs']
    # Cron daemon, not the web app — disable the inherited HTTP /healthz
    # HEALTHCHECK (would always fail here → false "unhealthy"). See bonus-period-close.
    healthcheck:
      disable: true
    env_file:
      # INTERNAL_CRON_TOKEN bearer for the internal escalation route — cron.env,
      # NOT auth.env (ADR-0053 addendum 2026-07-21 cron secret split; required
      # so a missing file fails compose-config, not runtime — see bonus-period-close).
      - /home/bbarnard065/.dr3-vision-secrets/cron.env
      # NTFY_PUBLISHER_TOKEN (ADR-0036) for the app-INDEPENDENT fire-failure
      # backstop (audit P1-4, scripts/bonus-escalation-check.mjs:publishFireFailure).
      # The tier fires POST through the app; if the app is down on payroll morning
      # every tier fails and the daemon must page ntfy directly — which needs this
      # token. Optional, same fail-soft contract as bonus-eod-check: when the file
      # is absent the daemon still attempts the tokenless ntfy.sh fallback topic.
      - path: /home/bbarnard065/.dr3-vision-secrets/ntfy.env
        required: false
    environment:
      NODE_ENV: production
      # Reach the app over the compose network by service name (not loopback —
      # this is a separate container). The route's cf-connecting-ip guard still
      # rejects any public-tunnel request; in-network POSTs carry no such header.
      INTERNAL_BASE_URL: http://app:3000
    depends_on:
      app:
        condition: service_healthy
    networks:
      - dr3net
    labels:
      <<: *barnardhq-labels
      com.barnardhq.service: 'bonus-escalation-check'
    logging: *logging

  bonus-eod-check:
    # Bi-site EOD bonus-entry enforcement daemon (ADR-0019 §2 + ADR-0028, T-113).
    #
    # Long-running Node daemon (same shape as bonus-period-close +
    # bonus-escalation-check): a single process under a single `unless-stopped`
    # restart policy that sleeps until the next 17:00 America/Los_Angeles instant
    # (recomputed each cycle off the Pacific wall clock so it survives the Mar/Nov
    # DST shifts) and on each fire iterates every bonus-enabled site (any site
    # with an active signature chain — today Woodland + Eugene). Per site it
    # checks today's `bonus_daily_entries`, skips weekends + site holidays, and
    # publishes one `dr3-vision-system` ntfy only when the site has ZERO entries
    # for the day (revised 2026-06-17, ADR-0019 §2 — a partial day is normal and
    # does not page), fingerprinted per (site, Pacific-day).
    #
    # Unlike the period-close / escalation daemons this does NOT POST an app
    # route — it queries Postgres directly and calls ntfy over HTTP, so it needs
    # DATABASE_URL + the ntfy publisher token, not INTERNAL_BASE_URL.
    #
    # Fail-soft: when NTFY_PUBLISHER_TOKEN is unset the daemon logs a no-op per
    # site instead of alerting; primary ntfy failure falls back to the public
    # ntfy.sh fallback topic (ADR-0036).
    image: dr3-vision-app:local
    container_name: dr3-vision-bonus-eod-check
    init: true
    restart: unless-stopped
    command: ['node', 'scripts/bonus-eod-check.mjs']
    # Cron daemon, not the web app — disable the inherited HTTP /healthz
    # HEALTHCHECK (would always fail here → false "unhealthy"). See bonus-period-close.
    healthcheck:
      disable: true
    env_file:
      - /home/bbarnard065/.dr3-vision-secrets/db.env
      # ntfy publisher token (ADR-0036) — optional, same fail-soft contract as
      # the app + migrate services. When absent the daemon no-ops per site.
      - path: /home/bbarnard065/.dr3-vision-secrets/ntfy.env
        required: false
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - dr3net
    labels:
      <<: *barnardhq-labels
      com.barnardhq.service: 'bonus-eod-check'
    logging: *logging

  bonus-daily-report:
    # Daily production report cron host (ADR-0030).
    #
    # Long-running Node daemon (same shape as bonus-period-close +
    # bonus-eod-check): a single process under `unless-stopped`. It is a THIN
    # Pacific scheduler — it imports only `@prisma/client` (no tsx, no TS), reads
    # the enabled `bonus_daily_report_config` rows' `send_time_pt`, sleeps until
    # the soonest next fire across all enabled sites (recomputed each iteration
    # off the Pacific wall clock so it survives the Mar/Nov DST shifts), then
    # POSTs the app's internal, loopback-guarded route
    # (`/api/internal/bonus/daily-report`). That route fires whichever sites are
    # due (build → send → log-write) compiled inside the Next app via
    # `runDailyReportFire`, so this daemon does no email/aggregation/TS import
    # (BUILD-CONTRACT divergence #1).
    #
    # Needs BOTH: DATABASE_URL (db.env) — it reads the enabled configs directly
    # to compute send times — AND the app's INTERNAL_CRON_TOKEN (cron.env, the
    # defense-in-depth bearer for the internal route; split out of auth.env
    # 2026-07-21 per the ADR-0053 addendum so cron containers no longer carry
    # NEXTAUTH_SECRET / Entra creds). INTERNAL_BASE_URL reaches the app over
    # the compose network by service name (not loopback — separate container);
    # the route's cf-connecting-ip guard still rejects any public-tunnel request.
    #
    # Idempotent: the route's log row is unique on (site, report_date), so a
    # second fire on the same day — or a restart-triggered re-fire — never
    # double-sends.
    image: dr3-vision-app:local
    container_name: dr3-vision-bonus-daily-report
    # Resource ceilings (audit 2026-07-16 · RES) — conservative blast-radius
    # cap on the shared host for a Chromium-invoking cron. Generous vs RSS.
    mem_limit: 1024m
    pids_limit: 256
    init: true
    restart: unless-stopped
    command: ['node', 'scripts/bonus-daily-report.mjs']
    # Cron daemon, not the web app — disable the inherited HTTP /healthz
    # HEALTHCHECK (would always fail here → false "unhealthy"). See bonus-period-close.
    healthcheck:
      disable: true
    env_file:
      # DATABASE_URL — the daemon reads enabled configs' send_time_pt directly.
      - /home/bbarnard065/.dr3-vision-secrets/db.env
      # INTERNAL_CRON_TOKEN bearer — cron.env, NOT auth.env (ADR-0053 addendum
      # 2026-07-21 cron secret split; required — see bonus-period-close).
      - /home/bbarnard065/.dr3-vision-secrets/cron.env
    environment:
      NODE_ENV: production
      # Reach the app over the compose network by service name (not loopback —
      # this is a separate container). The route's cf-connecting-ip guard still
      # rejects any public-tunnel request; in-network POSTs carry no such header.
      INTERNAL_BASE_URL: http://app:3000
    depends_on:
