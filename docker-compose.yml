  # ── ADR-0078 — idempotency-key TTL sweep ─────────────────────────────────
  #
  # `idempotency_keys` is a receipt book, not a ledger. A receipt answers "did
  # this exact write already land?", and that stops being asked once the device
  # that minted the key has synced. Seven days is generous by an order of
  # magnitude and exists so an iPad that spends a long weekend switched off in a
  # locker still replays correctly on Monday instead of double-writing.
  #
  # Fires at 03:10 PT, offset from the 02:30 audit sweep so the two are not
  # contending. The RETENTION FLOOR lives in the route, not here: a sweep whose
  # horizon the caller picks is one bad argument away from deleting live keys.
  # ADR-0019.4 — bonus signature-chain health check.
  #
  # Fires 06:30 PT daily, forty minutes ahead of the 07:10 escalation t1 and two
  # hours ahead of the 08:30 auto-override, so a broken chain is discoverable
  # while there is still time to fix it by hand before the 09:00 payroll
  # deadline. Twice (2026-07-07, 2026-08-04) the chain's auto-override actor was
  # a deactivated account and the ONLY thing that noticed was the auto-override
  # itself, at the moment it declined to run.
