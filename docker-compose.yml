    environment:
      NODE_ENV: production
      INTERNAL_BASE_URL: http://app:3000
    depends_on:
      app:
        condition: service_healthy
    networks:
      - dr3net
    labels:
      <<: *barnardhq-labels
      com.barnardhq.service: 'board-pack-digest'
    logging: *logging

